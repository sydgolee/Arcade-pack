<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leaderboards · 8-Bit Arcade Pack</title>
<meta name="description" content="Top 10 scores for every game in the 8-Bit Arcade Pack.">
<link href="fonts/fonts.css" rel="stylesheet">
<link href="site.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0a12">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="arcade.js"></script>
</head>
<body>
<div class="top"><a class="back" href="index.html">◀ GAMES</a></div>

<div class="read">
<h1>LEADERBOARDS</h1>
<p class="sub">Top 10 on this device. Pass the phone around.</p>
<div class="seg" id="gs" role="group" aria-label="Game"></div>
<div class="seg" id="ms" role="group" aria-label="Board" hidden></div>
<div class="panel"><table class="lb"><thead><tr><th>#</th><th>PLAYER</th><th style="text-align:right">SCORE</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="muted" id="how" style="margin-top:14px"></p>
</div>
<script>
const HOW={dungeon:'Score = rooms cleared, boss rooms and curses carried. The daily board resets every day.',wallmaze:'Wins vs the CPU only. Easy 150, Normal 300, Hard 600, plus 30 for every wall you never used. Wins after undo do not count.',fleet:'Wins only. Cadet 150, Captain 300, Admiral 600, plus 6 for every shot under 100.',cowboy:'Score = enemies, bosses and distance. Runs continued from a saloon save do not count.',gangster:'Score = enemies, bosses and distance. Runs continued from a hideout save do not count.',pool:'Wins vs the CPU only. Rookie 150, Hustler 300, Shark 600, plus 40 for every CPU ball left on the table.'};
const ids=Object.keys(ARC.GAMES);let g=new URLSearchParams(location.search).get('g');if(!ARC.GAMES[g])g=ids[0];let mode='main';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const gs=document.getElementById('gs'),ms=document.getElementById('ms');
function draw(){
 gs.innerHTML=ids.map(k=>`<button type="button" data-g="${k}" aria-pressed="${k===g}" style="--c:${ARC.GAMES[k].c}">${ARC.GAMES[k].t}</button>`).join('');
 ms.hidden=g!=='dungeon';ms.innerHTML=`<button type="button" data-m="main" aria-pressed="${mode==='main'}">ALL TIME</button><button type="button" data-m="daily" aria-pressed="${mode!=='main'}">TODAY'S DAILY</button>`;
 const list=ARC.board(g,g==='dungeon'&&mode!=='main'?'daily-'+today():'main'),me=ARC.name();
 document.getElementById('rows').innerHTML=list.length?list.map((r,i)=>`<tr><td class="r">${i+1}</td><td>${ARC.esc(r.n||'???')}${r.n&&r.n===me?' <span class="tag">YOU</span>':''}<small>${ARC.esc(r.d||'')} · ${new Date(r.t).toLocaleDateString()}</small></td><td class="s">${r.s}</td></tr>`).join(''):`<tr><td colspan="3" class="muted" style="text-align:center;padding:26px 6px">No scores yet.<br><a href="${ARC.GAMES[g].f}">Play ${ARC.GAMES[g].t} ▶</a></td></tr>`;
 document.getElementById('how').textContent=HOW[g];
 history.replaceState(null,'','?g='+g);
}
gs.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b){g=b.dataset.g;mode='main';draw()}});
ms.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){mode=b.dataset.m;draw()}});
draw();</script>
<script src="shell.js"></script>
</body>
</html>
