<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Awards · 8-Bit Arcade Pack</title>
<meta name="description" content="Awards and play stats for the 8-Bit Arcade Pack.">
<link href="fonts/fonts.css" rel="stylesheet">
<link href="site.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0a12">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="arcade.js"></script>
</head>
<body>
<div class="top"><a class="back" href="index.html">◀ GAMES</a></div>

<div class="wrap">
<h1>AWARDS</h1>
<p class="sub" id="cnt"></p>
<div class="aw" id="aw"></div>
<h2>YOUR STATS</h2>
<div class="stats" id="st"></div>
</div>
<script>
const got=ARC.awards();
document.getElementById('cnt').textContent=`${Object.keys(got).length} of ${ARC.AWARDS.length} unlocked`;
document.getElementById('aw').innerHTML=ARC.AWARDS.map(([id,t,d])=>`<div class="award${got[id]?' got':''}"><div class="ico" aria-hidden="true">${got[id]?'★':'?'}</div><div><b>${t}</b><span>${d}</span>${got[id]?`<span class="muted" style="font-size:15px">${new Date(got[id]).toLocaleDateString()}</span>`:''}</div></div>`).join('');
const s=ARC.stats(),G=ARC.GAMES,fmt=t=>t>=3600?Math.floor(t/3600)+'h '+Math.floor(t%3600/60)+'m':Math.floor(t/60)+'m';
const tot=Object.values(s.g).reduce((a,g)=>a+(g.time||0),0),plays=Object.values(s.g).reduce((a,g)=>a+(g.plays||0),0);
document.getElementById('st').innerHTML=`<div class="stat"><b>${fmt(tot)}</b><span>total play time</span></div><div class="stat"><b>${plays}</b><span>sessions</span></div>`+Object.keys(G).map(k=>{const g=s.g[k]||{};return `<div class="stat" style="border-color:${g.plays?G[k].c:'#2a2535'}"><b style="color:${G[k].c}">${fmt(g.time||0)}</b><span>${G[k].t}</span></div>`}).join('');</script>
<script src="shell.js"></script>
</body>
</html>
